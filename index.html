
<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07111f" />
  <meta name="description" content="APK Management - Inventory and Finance Dashboard" />

  <title>APK Management</title>

  <!-- OneSignal Web SDK v16 -->
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];

    window.OneSignalReady = new Promise((resolve, reject) => {
      window.OneSignalDeferred.push(async function (OneSignal) {
        try {
          console.log('[OneSignal] Memulai registrasi Worker...');

          // 1. Daftarkan Service Worker OneSignal terlebih dahulu
          const registration = await navigator.serviceWorker.register(
            '/OneSignalSDKWorker.js',
            {
              scope: '/push/onesignal/'
            }
          );

          console.log('[OneSignal] Registrasi Worker:', registration.scope);

          // 2. Tunggu sampai Worker aktif
          let worker =
            registration.installing ||
            registration.waiting;

          if (worker && worker.state !== 'activated') {
            await new Promise((resolveWorker, rejectWorker) => {
              const checkState = () => {
                if (worker.state === 'activated') {
                  resolveWorker();
                }

                if (worker.state === 'redundant') {
                  rejectWorker(
                    new Error('OneSignal Service Worker gagal diaktifkan.')
                  );
                }
              };

              worker.addEventListener('statechange', checkState);
              checkState();
            });
          }

          if (!registration.active) {
            throw new Error('OneSignal Service Worker belum aktif.');
          }

          console.log('[OneSignal] Worker berhasil aktif.');

          // 3. Inisialisasi SDK setelah Worker tersedia
          await OneSignal.init({
            appId: 'b34f93f7-d830-4c4a-9d3f-ad6805b6a29e',

            serviceWorkerPath: '/OneSignalSDKWorker.js',

            serviceWorkerParam: {
              scope: '/push/onesignal/'
            }
          });

          console.log('[OneSignal] INISIALISASI BERHASIL');

          resolve(OneSignal);

        } catch (error) {
          console.error('[OneSignal] ERROR:', error);
          reject(error);
        }
      });
    });
  </script>

  <script
    src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
    defer
    onerror="console.error('[OneSignal] Gagal memuat SDK')"
  ></script>
</head>

<body>
  <div id="root"></div>

  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
